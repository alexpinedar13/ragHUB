[project]
name = "proyecto"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alexander Pineda", email = "alexander.pinedar@urosario.edu.co" }
]
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.6.3",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "qdrant-client>=1.20.0",
    "rdflib>=7.6.0",
    "requests>=2.34.2",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
proyecto = "proyecto:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
